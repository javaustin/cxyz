    unmuted: "&aYou will now receive {channel-name} notifications."                                                            # Available placeholders: {channel-name}, {channel-prefix}, ...
    not-muted: "&eThis channel is not muted!"                                                                                  # Available placeholders: {channel-name}, {channel-prefix}, ...
    already-muted: "&eThis channel is already muted!"                                                                          # Available placeholders: {channel-name}, {channel-prefix}, ...
    error.not-mutable: "&cThis channel cannot be ignored!"                                                                     # Available placeholders: {channel-name}, {channel-prefix}, ...
    channel-muted: "&eYou tried sending a message in the {channel-name} chat, but you have this channel muted!"                # Available placeholders: {channel-name}, {channel-prefix}, ...

