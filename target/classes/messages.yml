          {player-rank-color}{player-display-name}'s equipped cosmetics
          {cosmetics}
          [&f< Previous](RUN_COMMAND:/cosmetic list equipped {previous-page})   &7Page {page}/{max-pages}   [&fNext >](RUN_COMMAND:/cosmetic list equipped {previous-page})
        blank: "&eNo cosmetics are equipped!"                                                                           # Available placeholders: {player}, ...
        entry-format: "[{cosmetic-display-stripped}](HOVER:{cosmetic-lore}) [(({cosmetic-id}))](HOVER:Type: &e{cosmetic-type})  &f&f&f  [&e[[Buy]]](RUN_COMMAND:/cosmetic buy {cosmetic-id}) [&e[[Equip]]](RUN_COMMAND:/cosmetic equip {cosmetic-id}) [&e[[Unequip]]](RUN_COMMAND:/cosmetic unequip {cosmetic-id})" # Available placeholders: {cosmetic-id}, {cosmetic-display-stripped}, {cosmetic-lore}, {cosmetic-type}, ...
        separator: "\n"                                                                                                 # Available placeholders: none
        max-entries-per-page: 8                                                                                         # Available placeholders: none

      owned:
        message: |                                                                                                      # Available placeholders: {player}, {cosmetics}, {page}, {max-pages}, {previous-page}, {next-page}, ...
          {player-rank-color}{player-display-name}'s owned cosmetics
          {cosmetics}
          [&f< Previous](RUN_COMMAND:/cosmetic list owned {previous-page})   &7Page {page}/{max-pages}   [&fNext >](RUN_COMMAND:/cosmetic list owned {previous-page})
        blank: "&eNo cosmetics are owned!"                                                                              # Available placeholders: {player}, ...
        entry-format: "[{cosmetic-display-stripped}](HOVER:{cosmetic-lore}) [(({cosmetic-id}))](HOVER:Type: &e{cosmetic-type})  &f&f&f  [&e[[Buy]]](RUN_COMMAND:/cosmetic buy {cosmetic-id}) [&e[[Equip]]](RUN_COMMAND:/cosmetic equip {cosmetic-id}) [&e[[Unequip]]](RUN_COMMAND:/cosmetic unequip {cosmetic-id})" # Available placeholders: {cosmetic-id}, {cosmetic-display-stripped}, {cosmetic-lore}, {cosmetic-type}, ...
        separator: "\n"                                                                                                 # Available placeholders: none
        max-entries-per-page: 8                                                                                         # Available placeholders: none

    enable: "&aEnabled the following cosmetic types: {enabled-types}"                                                   # Available placeholders: {enabled-types}, {player}, ...
    disable: "&aDisabled the following cosmetic types: {disabled-types}"                                                # Available placeholders: {disabled-types}, {player}, ...

