      &aCoins subcommands:
      &e/coins add <amount> [[player]]
      &e/coins remove <amount> [[player]]
      &e/coins set <amount> [[player]]
      &e/coins view [[player]]
    added: "&aSuccessfully added {amount} coins to {player}!"                                                                  # Available placeholders: {amount}, {player}, {player-display-name}, ...
    removed: "&aSuccessfully removed {amount} coins from {player}!"                                                            # Available placeholders: {amount}, {player}, {player-display-name}, ...
    set: "&aSuccessfully set {amount} coins to {player}!"                                                                      # Available placeholders: {amount}, {player}, {player-display-name}, ...
    view: "&a{player} has {amount} coins!"                                                                                     # Available placeholders: {amount}, {player}, {player-display-name}, ...

  cosmetic:
    available-subcommands: |                                                                                                   # Available placeholders: none
      &aCosmetic subcommands:
      &e/cosmetic buy <item>
      &e/cosmetic equip <item>
      &e/cosmetic list <owned | equipped | all> [[player]] [[page]]
      &e/cosmetic unequip <item>

    buy:
