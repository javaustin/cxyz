    already-unlocked: "&eThe {channel-name} channel is not locked!"                                                            # Available placeholders: {channel-name}, {channel-prefix}, ...
    lock-forbidden: "&cThis channel cannot be locked!"                                                                         # Available placeholders: {channel-name}, {channel-prefix}, ...
    locked: "&4[[!]]&r {player-rank-prefix}{player-rank-color}{player-display-name} &7locked the {channel-name} channel."      # Available placeholders: {channel-name}, {channel-prefix}, {player}, {player-display-name}, ...
    unlocked: "&4[[!]]&r {player-rank-prefix}{player-rank-color}{player-display-name} &7unlocked the {channel-name} channel."  # Available placeholders: {channel-name}, {channel-prefix}, {player}, {player-display-name}, ...

    ignore-list:
      message: "&aYou are ignoring the following channels: &7{ignored-channels}"                                               # Available placeholders: {ignored-channels}, {player}, ...
      blank: "&eNo ignored channels found for this player!"                                                                    # Available placeholders: {player}, ...
      entry-format: "{channel-prefix}"                                                                                         # Available placeholders: {channel-name}, {channel-prefix}, ...
      separator: ", "                                                                                                          # Available placeholders: none
      max-entries-per-page: -1                                                                                                 # Available placeholders: none


  chat-color:
    set: "&aChat color set to {code}{color}!"                                                                                  # Available placeholders: {code}, {color}, {player}, ...
    reset: "&aChat color reset!"                                                                                               # Available placeholders: {player}, {player-display-name}, ...
    view: "&aYour chat color is set to {code}{color}!"                                                                         # Available placeholders: {code}, {color}, {player}, ...
    duplicate-state: "&eYour chat color is already set to this!"                                                               # Available placeholders: {code}, {color}, {player}, ...

