      content: "&cYou cannot send a blank message!"                                                                            # Available placeholders: none

    invalid:
      attribute: "[&cAttribute not found!](HOVER:&7Could not find an attribute named {attribute} in the entry!)"               # Available placeholders: {attribute}
      boolean: "[&cPlease provide a valid boolean!](HOVER:((Ex: true/false)))"                                                 # Available placeholders: {input}
      channel: "&cPlease provide a valid channel!"                                                                             # Available placeholders: {input}
      color: "&cPlease provide a valid color!"                                                                                 # Available placeholders: {input}
      cosmetic: "&cPlease provide a valid cosmetic!"                                                                           # Available placeholders: {input}
      cosmetic-type: "&cPlease provide a valid cosmetic type!"                                                                 # Available placeholders: {input}
      debug: "&cPlease provide a valid debugger!"                                                                              # Available placeholders: {input}
      duration: "&cPlease provide a valid duration!"                                                                           # Available placeholders: {input}
      enchant: "&cPlease provide a valid enchant!"                                                                             # Available placeholders: {input}
      enchantable-item: "&cItem {item} cannot be enchanted."                                                                   # Available placeholders: {item}, {level}, {enchant"
      item: "&cPlease provide a valid item!"                                                                                   # Available placeholders: {input}
      number: "&cPlease provide a valid number!"                                                                               # Available placeholders: {input}
      page: "[&cPlease provide a valid page between {min}-{max}!](HOVER:Your input: {page})"                                   # Available placeholders: {min}, {max}, {page}
      punishment: "&cNo punishment found with this case ID!"                                                                   # Available placeholders: {min}, {max}, {page}
      rank: "&cPlease provide a valid rank name!"                                                                              # Available placeholders: {input}
      repairable-item: "&cItem does not have a durability attribute."                                                          # Available placeholders: {item}
      timezone: "&cPlease provide a valid timezone!"                                                                           # Available placeholders: {input}
      friend-privacy-value: "[&cPlease provide a valid value!](HOVER:((Ex: ALLOWED/DISALLOWED)))"                              # Available placeholders: {input}
      message-privacy-value: "[&cPlease provide a valid value!](HOVER:((Ex: ALLOWED/FRIENDS_ONLY/DISALLOWED)))"                # Available placeholders: {input}
      party-privacy-value: "[&cPlease provide a valid value!](HOVER:((Ex: ALLOWED/FRIENDS_ONLY/DISALLOWED)))"                  # Available placeholders: {input}
      powertool-item: "&cItem {item} cannot be bound to."                                                                      # Available placeholders: {item}
      nickname-length: "&cNickname must be between 3 and 16 characters."                                                       # Available placeholders: {input}
      nickname-characters: "&cA nickname must be made up of letters, numbers, and underscores only."                           # Available placeholders: {input}
