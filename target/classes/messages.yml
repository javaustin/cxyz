      error.insufficient-coins: "&cYou cannot afford this item!"
      error.insufficient-level: "&cThis item requires level {cosmetic-required-level} &c or above!"
      error.duplicate-item: "&cYou already own this item!"
      error.disabled-item: "&cYou already own this item!"
      success: "&aYou purchased [{cosmetic-display}]({HOVER:cosmetic-lore})&afor {cosmetic-price} coins!"


    equip:
      error.already-equipped: "&cThis cosmetic is already equipped!"                                                           # Available placeholders: {cosmetic}, {cosmetic-display}, {cosmetic-required-level}, {cosmetic-price}, {cosmetic-required-rank}, ...,  {player}, {player-display-name}, ...
      error.not-owned: "&cYou do not own this cosmetic!"                                                                       # Available placeholders: {cosmetic}, {cosmetic-display}, {cosmetic-required-level}, {cosmetic-price}, {cosmetic-required-rank}, ...,  {player}, {player-display-name}, ...
      error.insufficient-rank: |                                                                                               # Available placeholders: {cosmetic}, {cosmetic-display}, {cosmetic-required-level}, {cosmetic-price}, {cosmetic-required-rank}, ...,  {player}, {player-display-name}, ...
        &cYou cannot apply this cosmetic as you do not have the required {cosmetic-required-rank-prefix-display} &crank.
      success: "&aYou have equipped [{cosmetic-display-stripped}](HOVER:{cosmetic-lore})"                                      # Available placeholders: {cosmetic}, {cosmetic-display}, {cosmetic-lore}, {cosmetic-required-level}, {cosmetic-price}, ...

    unequip:
      error.not-equipped: "&cThis cosmetic is not equipped!"                                                                   # Available placeholders: {cosmetic}, {cosmetic-display}, {player}, ...
      error.not-owned: "&cYou do not own this cosmetic!"                                                                       # Available placeholders: {cosmetic-id}, {cosmetic-display}, {player}, ...
      success: "&aYou have unequipped [{cosmetic-display}](HOVER:{cosmetic-lore})"                                             # Available placeholders: {cosmetic-display}, {cosmetic-lore}, {player}, ...

    list:
      all:
        message: |                                                                                                             # Available placeholders: {cosmetics}, {page}, {max-pages}, {previous-page}, {next-page}, ...
          &bAll server cosmetics
          {cosmetics}
          [&f< Previous](RUN_COMMAND:/cosmetic list all {previous-page})   &7Page {page}/{max-pages}   [&fNext >](RUN_COMMAND:/cosmetic list all {previous-page})
        blank: "&eNo cosmetics found!"                                                                                         # Available placeholders: {player}, ...
        entry-format: |                                                                                                        # Available placeholders: {cosmetic-id}, {cosmetic-display-stripped}, {cosmetic-lore}, {cosmetic-type}, ...
