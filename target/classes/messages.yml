# ============================================================
# OVERVIEW
# ============================================================
#
# This file includes every single message sent in this plugin. You can modify any message sent
# by simply changing the text, saving the file, and reloading the plugin.


  # ----------------------------------------------------------
  # COLOR
  # ----------------------------------------------------------
  # The messages in this file support legacy color codes (such as '&a', '&b', '&4'),
  # and modern RGB codes in the form of Minecraft RGB syntax (like the color red as '&x&f&f&0&0&0&0').
  #
  #
  # ----------------------------------------------------------
  # PLACEHOLDERS
  # ----------------------------------------------------------
  #
  # Almost every single message in this file supports placeholder indicators. These placeholders are resolved at runtime,
  # converting the text from some the arbitrary placeholder text (such as {player}), to its' actual value (such as 'Steve').
  #
  # For example:
  #   The message: "{player} has joined the party!"
  #      resolves into -> "Steve has joined the party!"
  #                            ^ if the placeholder player is Steve
  #
  # * A detailed glossary of commonly-used placeholders is displayed at line `69` of this file.
  #
  #
  # ----------------------------------------------------------
  # CLICKABLE MESSAGES
  # ----------------------------------------------------------
  #
  # This plugin supports message actions by using the format:
  #    [TEXT](ACTION_TYPE:ACTION_TEXT)
  #    ^ The clickable text is enclosed by [brackets],
  #       and the action is enclosed by (parentheses).
  #
  # [!] The plugin will throw an error if a clickable text block is not immediately followed by an action block.
  #
  # [!] To use brackets or parentheses in a message without creating a clickable
  #     component, double the characters: "(" -> "((", "[" -> "[[", ")" -> "))", "]" -> "]]"
  #
  #     For example:
  #                      Message                                           Output
  #            "[An incorrect example message]"   ->  Error (An action block must follow a clickable text block)
  #            "[[A correct example message!]]"   ->  [A correct example message!]
  #
  # Any amount of actions can be added to a clickable message
  #    [TEXT](ACTION_TYPE:ACTION_TEXT)[MORE_TEXT](ACTION_2_TYPE:ACTION_2_TEXT)[...](...)
  #
  # Supported action types:
  #   HOVER
  #   OPEN_URL
  #   RUN_COMMAND
  #   SUGGEST_COMMAND
  #   COPY_TO_CLIPBOARD
  #
  # As an example, you can create a message that will give you a diamond if you click on "Click me".
  #    "[Click me](RUN_COMMAND:/give @s diamond) for diamonds!"
  #     ^           ^           ^                ^
  #     Clickable   Action      Action           Non-Clickable
  #     Text        Specifier   Text             Text
  #
  # Placeholders and colors are supported too:
  #    "[&c{player} just joined! If you click this message, their UUID will be copied to your clipboard!](COPY_TO_CLIPBOARD:{player-uuid})(RUN_COMMAND:/show ~ &x&f&3&a&2&9&0Copied!)"
  #
  #
  # ----------------------------------------------------------
  # PLACEHOLDER GLOSSARY
  # ----------------------------------------------------------
  #
  # '*' represents related placeholders provided by another group. For example; {mod*} in the punishment group represents all player-based
  # placeholders prefixed by {mod}. So this would generate: {mod}, {mod-uuid}, {mod-username}, {mod-nickname}, ...
  #
  #
  # PLAYER:
  #   If the prefix is {player}:
  #     {player}, {player-uuid}, {player-username}, {player-nickname}, {player-nickname-display}, {player-display-name}, {player-rank}, {player-rank-prefix},
  #     {player-rank-prefix-display}, {player-rank-color}, {player-custom-rankplate}, {player-custom-rankplate-display}, {player-custom-rankplate-lore}, {player-tag},
  #     {player-tag-display}, {player-tag-lore}, {player-chat-color}, {player-chat-color-name}, {player-chat-channel}, {player-chat-channel-prefix}, {player-server},
  #     {player-vanish-status}, {player-online-status}, {player-first-join-date}, {player-first-join-short-date}, {player-last-join-date}, {player-last-join-short-date},
  #     {player-last-online-date}, {player-last-online-short-date}, {player-first-join-time}, {player-first-join-short-time}, {player-last-join-time},
  #     {player-last-join-short-time}, {player-last-online-time}, {player-last-online-short-time}, {player-date}, {player-date-short}, {player-time}, {player-time-short},
  #     {player-timezone}, {player-playtime}, {player-last-ip}, {player-coins}, {player-level}, {player-xp}, {player-message-privacy}, {player-friend-privacy},
  #     {player-party-privacy}, {player-ignore-list-size}, {player-friend-list-size}, {player-owned-cosmetics-list-size}, {player-equipped-cosmetics-list-size},
  #     {player-muted-channels-list-size}, {player-ignored-channels-list-size}, {player-world}, {player-x}, {player-y}, {player-z}, {player-yaw}, {player-pitch},
  #     {player-rounded-yaw}, {player-rounded-pitch}, {player-block-x}, {player-block-y}, {player-block-z}
  #
  # RANK:
  #   If the prefix is {rank}:
  #     {rank}, {rank-name}, {rank-color}, {rank-prefix}, {rank-prefix-display}, {rank-position}, {rank-hierarchy}, {rank-chat-color}, {rank-chat-cooldown}
  #
  # CHANNEL:
  #   If the prefix is {channel}:
  #     {channel}, {channel-name}, {channel-prefix}, {channel-chat-format}, {channel-webhook-url}, {channel-trigger-prefix}, {channel-is-console-enabled},
  #     {channel-is-ignorable}, {channel-is-lockable}, {channel-is-locked}, {channel-is-read-only}
  #
  # COSMETIC:
  #   If the prefix is {cosmetic}:
  #   {cosmetic}, {cosmetic-id}, {cosmetic-lore}, {cosmetic-display}, {cosmetic-display-stripped}, {cosmetic-required-level}, {cosmetic-required-rank*},
  #   {cosmetic-price}, {cosmetic-type}
  #
  # PUNISHMENT:
  #   (No prefix):
  #       {mod*}, {editor-mod*}, {case-id}, {type}, {type-lowercase}, {duration}, {duration-short}, {expire-duration}, {expire-duration-short}, {enforced}, {reason}


# ============================================================
# MESSAGES
# ============================================================
#
# Available placeholders for each message are listed on the right margin of the file.

