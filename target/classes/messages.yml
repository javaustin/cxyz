    not-found-uuid: "[&cPlayer not found!](HOVER:&7Could not find player with the uuid of &f{uuid}&7!)"                        # Available placeholders: {username}
    outranks-sender: "&cYou cannot use this command on a player which outranks you!"                                           # Available placeholders: {player}, {sender}, {player-display-name}, ...
    is-offline: "&cThis player is offline!"                                                                                    # Available placeholders: {player}, {player-display-name}, {player-online-status}, ...

  args:
