# ============================================================
# ENVIRONMENT VARIABLES
# ============================================================
# You can use environment variables to provide configuration values at runtime,
# which is useful when deploying multiple servers without editing this file.
#
# To use an environment variable, set a supported value to "ENV:{VARIABLE_NAME}".
# Replace {VARIABLE_NAME} with the name of the environment variable. For example:
#   identifier: "ENV:IDENTIFIER"
#
# [!] The plugin will crash if an environment variable does not exist, or it cannot access the variable,
#
# [!] Environment-variable references are supported only for the server definitions and HTTP settings. No other sections support this setting!

# ============================================================
# SERVER AND API DEFINITIONS
# ============================================================
# For communicating securely with the backend API server, we must send requests with an identity and a signature.
# These can also be defined by environment variables if present.
#
# Required fields:
#   this-server.identifier - An identifiable name for this server (e.g. "HUB-1"). Avoid spaces.
#   this-server.secret     - A secret key used to authenticate server-to-server HTTP requests.
#   api.identifier         - The identifier of the backend API server.
#   api.endpoint           - The publicly reachable URL of the backend API server
#                            (e.g. https://api.cerrot.xyz).
#   api.secret             - A secret key used to authenticate requests to the backend API.
#
# The identifier and secret values must match the corresponding server/API credentials.
this-server:
  identifier: "ENV:IDENTIFIER"
  secret: "ENV:SECRET"

api:
  identifier: "ENV:API_IDENTIFIER"
  endpoint: "ENV:API_ENDPOINT"
  secret: "ENV:API_SECRET"


# ============================================================
# HTTP SETTINGS
# ============================================================
# Defines behavior for this plugin's HTTP client and outbound requests.
# These can also be defined by environment variables if present.
#
# Required fields:
#   request-timeout-millis - Maximum time, in milliseconds, to wait for an HTTP response.
#   http-port              - Local TCP port used by the plugin's HTTP listener. The port must be available and reachable by the backend API.
#                            On managed hosts, you may need to create a port allocation.
request-timeout-millis: 5000
http-port: 59152


# ============================================================
# SERVER TIME SETTINGS
# ============================================================
# Default timezone used by the plugin. Players can set individual timezones that override this.
# Must use an IANA timezone ID, such as America/Los_Angeles or UTC.
timezone: America/Los_Angeles

# Date/time formats used when displaying dates and times. Values use Java DateTimeFormatter syntax.
# The short variants are used where a more compact display is appropriate.
# Formatting reference:
#    https://docs.oracle.com/javase/8/docs/api/java/time/format/DateTimeFormatter.html

date-format: MMMM d, yyyy
date-short-format: M/d/yyyy
time-format: h:mm a (z)
time-short-format: h:mm a


# ============================================================
# DEBUGGING
# ============================================================
# Enables additional logging for troubleshooting. Values are case-insensitive.
#
# Available options:
#  COSMETIC,
#  FRIEND_REQUEST,
#  GAME_STAT,
#  MAP,
#  MESSAGE_PARSER,
#  PARTY,
#  PLAYER_MESSAGE,
#  PUNISHMENT,
#  REQUESTS,
#  SHORTHAND_COMMANDS,
#  USER
#
# Leave empty [] to disable debugging at startup.
# Debuggers can also be enabled or disabled at runtime with /debug.
debugger:
  enabled-values: []


# ============================================================
# NETWORK RANKS
# ============================================================
# Ranks stored in the central user database and shared across the network.
#
# Permissions automatically follow the format:
#   cxyz.rank.{rankName}
#
# Example:
#   cxyz.rank.vip
#
# Required fields:
#    prefix              - Text displayed before a player's name when the rank is shown.
#    color               - Color used for the rank and rank-colored player display text.
#    default-chat-color  - Fallback color used for the player's chat messages.
#    chat-cooldown       - Minimum number of seconds between messages sent by players with this rank.
#    hierarchy           - Unique integer used to compare rank power; higher values are more powerful.
#
# [!] A default rank is required and denoted by "default". If one is not provided in config this plugin will make one for you.
#
# [!] Ranks are individual and do not stack.
ranks:

  default:
    prefix: '&7'
    color: '&7'
    default-chat-color: '&f'
    chat-cooldown: 3
    hierarchy: 0

  vip:
    prefix: '&f[&aVIP&f] '
    color: '&a'
    default-chat-color: '&f'
    chat-cooldown: 1
    hierarchy: 1

  mvp:
    prefix: '&f[&bMVP&f] '
    color: '&b'
    default-chat-color: '&f'
    chat-cooldown: 0
    hierarchy: 2

  mod:
    prefix: '&f[&eMod&f] '
    color: '&e'
    default-chat-color: '&f'
    chat-cooldown: 0
    hierarchy: 3

  admin:
    prefix: '&f[&cAdmin&f] '
    color: '&c'
    default-chat-color: '&f'
    chat-cooldown: 0
    hierarchy: 4


# ============================================================
# CHAT SYSTEM
# ============================================================
# Channels allow communication across all servers.
#
# Permissions:
#   Custom channels require cxyz.channel.{channel} to use them.
#   Core channels are available by default; denying cxyz.channel.{channel} restricts access.
#
# Required fields:
#    prefix           - The formal prefix of the channel. This can be used in GUI's or channel command messages, but it is not automatically added as a chat prefix.
#    read-only        - A boolean value for the read-only status of a channel. Put `true` if a channel should be read-only,
#                       meaning it cannot be typed in. System messages may still be sent regardless of this value.
#    console          - A boolean value for the console-sendable status of a channel. Put `true` if all content sent in the channel should be forwarded to the console.
#    ignorable        - A boolean value for the ignorable status of a channel. Put `true` if players should have the ability to ignore this channel using `/channel ignore`.
#    webhook-url      - An optional URL for forwarding messages from this channel to discord via a webhook. Leave blank to disable.
#    chat-format      - The chat message format that will be used to format and send messages in the channel.
#    trigger-prefix   - A leading multi-character string that allows players to select this channel just by typing the trigger prefix.
#                         Example: If the trigger prefix is '#', and the channel is named `staff`. A player can type "#Hello Staff",
#                                  and the resulting message will be "Hello Staff", sent in the `staff` channel.
#    aliases          - A string list of aliases (alternative names) for channels.
#                         Example: The public channel can have the aliases: [all, a, pub]
#    lockable         - A boolean value for the lock-able status of a channel. Put `true` if the channel has the ability to be locked when an admin runs `/channel lock`
#    locked           - A boolean value for the current lock status of a channel. A lock can be bypassed by a player with the permission `cxyz.channel.{channel-name}.lock-bypass`
#
# [!] Channel names must be unique
#
# [!] Channel names are NOT case-sensitive
#
# [!] Do NOT reuse trigger-prefix values
#
# [!] Core channels are built into the plugin; add user-defined channels under custom-channels
chat:
  # ----------------------------------------------------------
  # CORE CHANNELS
  # ----------------------------------------------------------
  # These are built-in system channels.
  # Do NOT add new ones here.

  # These channels are accessible by default. You can restrict players from using these channels by explicitly denying the permission "cxyz.channel.{name}".

  core-channels:

    all:
      prefix: '&ePUBLIC'
      read-only: false
      console: true
      ignorable: false
      webhook-url: ''
      chat-format: '[{player-tag}](HOVER:{player-tag-lore})[{player-rank-prefix}](HOVER:{player-custom-rankplate-lore}){player-rank-color}{player-display-name}: {player-chat-color}{message}'
      trigger-prefix: ""
      aliases: [public, pub, a]
      lockable: true
      locked: false

    party:
      prefix: '&9PARTY'
      read-only: false
      console: false
      ignorable: true
      webhook-url: ''
      chat-format: ''
      trigger-prefix: ""
      aliases: [p]
      lockable: true
      locked: false

    message:
      prefix: '&dMESSAGE'
      read-only: false
      console: false
      ignorable: true
      webhook-url: ''
      chat-format: ''
      trigger-prefix: ""
      aliases: [msg, m]
      lockable: true
      locked: false


  # ----------------------------------------------------------
  # CUSTOM CHANNELS
  # ----------------------------------------------------------
  # You may create additional private or staff channels here.

  # These channels are private by default. You can allow players to use these channels adding the permission "cxyz.channel.{name}".

  custom-channels:
    logs:
      chat-format: '{channel-prefix}&7{content}'
      console: true
      ignorable: true
      prefix: '&e[Logger] '
      read-only: true
      trigger-prefix: ''
      webhook-url: ''
      aliases: [ ]
      lockable: true
      locked: false

    staff:
      prefix: '&c[Staff] '
      read-only: false
      console: true
      ignorable: true
      webhook-url: ''
      chat-format: '{channel-prefix}{player-rank-color}{player-display-name}: &f{content}'
      trigger-prefix: '#'
      aliases: [ s ]
      lockable: true
      locked: false

    manager:
      prefix: '&4[Manager] '
      read-only: false
      console: true
      ignorable: true
      webhook-url: ''
      chat-format: '{channel-prefix}{player-rank-color}{player-display-name}: &f{content}'
      trigger-prefix: '$'
      aliases: [ ]
      lockable: true
      locked: false

    announcement:
      prefix: '&6Announcement'
      read-only: true
      console: true
      ignorable: true
      webhook-url: ''
      chat-format: '{message}'
      trigger-prefix: ""
      aliases: [ ]
      lockable: true
      locked: false

  # ----------------------------------------------------------
  # DEFAULT CHANNEL MAPPINGS
  # ----------------------------------------------------------
  # Maps each system-message type to the defined channel as the default.
  #
  # Available system-message types:
  #    announcement - The system-message type used for announcements
  #    punishment   - The system-message type used for punishment notifications
  #    message      - The system-message type used for private messages
  #    party        - The system-message type used for party messages
  #    public       - The system-message type used for public chat
  defaults:
    announcement: announcement
    punishment: staff
    message: message
    party: party
    public: all

  # ----------------------------------------------------------
  # CHAT FILTER
  # ----------------------------------------------------------
  # Prevent unwanted messages from being sent in the chat, and optionally punish players using commands.
  #
  # [!] Players with the `cxyz.chat-filter-bypass.{rule-name}` permission are not subject to the rule.
  chat-filter:
    enabled: true

    rules:
      example-rule:
        enabled-channels: [all, message]
        blacklisted-words: ["nigger", "faggot"]
        actions:
          - mute {player} 24h discriminatory language


# ============================================================
# COLOR DEFINITIONS
# ============================================================
# Defines color names usable in plugin commands and configs.
# Values may use Minecraft legacy color codes (for example `&a`) or hex color sequences in the form `&x&R&R&G&G&B&B`.
# The key is the name used by commands or other configuration values.

colors:

  # Minecraft legacy colors
  black: "&0"
  dark_blue: "&1"
  dark_green: "&2"
  dark_aqua: "&3"
  dark_red: "&4"
  dark_purple: "&5"
  gold: "&6"
  gray: "&7"
  dark_gray: "&8"
  blue: "&9"
  green: "&a"
  aqua: "&b"
  red: "&c"
  light_purple: "&d"
  yellow: "&e"
  white: "&f"

  # Example custom color
  darker_green: "&x&2&f&a&5&2&b"


# ============================================================
# ANNOUNCEMENTS
# ============================================================
# Broadcast messages that appear across servers.
#
# Required Fields:
#   enabled  - Whether the announcement is scheduled to send. If `false`, the announcement will not send.
#   content    - The parsable content of the announcement
#   channel    - The chat channel the announcement will be sent in
#   delay      - The delay (in seconds) the plugin should wait until sending the announcement (from plugin startup)
#   interval   - The delay (in seconds) the plugin should wait to repeat the announcement (set to 0 to never repeat)
#   scope      - (GLOBAL, LOCAL). If GLOBAL, the announcement will be sent to all game servers. If not, the announcement will only be sent on this server.
#
# Announcement names must be unique. The configured channel must be a core or custom channel.

announcements:

  new-example-announcement:
    enabled: true
    content: '&4Another example announcement'
    channel: announcement
    delay: 30
    interval: 60
    scope: GLOBAL


# ============================================================
# PARTY SYSTEM
# ============================================================
# Controls party functionality and party lifecycle timeouts.
#   enabled              - Whether party commands and party behavior are enabled.
#   autokick-after       - Seconds after which an empty party is automatically disbanded.
#   invites-expire-after - Seconds before a party invitation expires.
#   max-players          - Maximum number of players allowed in one party.
parties:
  enabled: true
  autokick-after: 300
  invites-expire-after: 60
  max-players: 10000


# ============================================================
# FRIEND SYSTEM
# ============================================================
#   requests-expire-after - Number of seconds before an unanswered friend request expires.
friends:
  requests-expire-after: 300


# ============================================================
# PUNISHMENT DEFAULTS
# ============================================================
punishments:
  defaults:

    reasons:
      warn: Bad Behavior
      mute: Chat Abuse
      kick: Unspecified
      ban: Hacking

    durations: # Enter times in SECONDS.
      permanent: "permanent" # Text shown for a permanent duration instead of a number such as -1.

      effective-until: # The time until the punishment is no longer effective.
        warn: 604800 # 1 week. A warning is stored but does not actively affect the player.
        mute: 3600 # 1 hour
        kick: 0 # (Kicks are not persistent by definition, any value here will be ignored)
        ban: -1 # Permanent

      expire: # The time until the record of the punishment is cleared.
        warn: -1 # Record never expires
        mute: 2622600 # Record retention period in seconds.
        kick: 0 # Record expires immediately
        ban: -1 # Record never expires

  # Commands that a muted player is restricted from executing.
  mute-restrictions:
    - msg
    - message
    - r
    - party chat
    - broadcast


# ============================================================
# SOCIAL DISPLAY SETTINGS
# ============================================================
# When a player joins the server, you can configure their Minecraft display names and tab list name, in addition to their join and leave messages.
social:
  player-default-list-name: "{player-rank-prefix}{player-rank-color}{player-display-name}"
  player-default-display-name: "{player-rank-color}{player-display-name}"

  player-join-message: ""
  player-leave-message: ""

# ============================================================
# CUSTOM COMMAND SHORTHANDS
# ============================================================
# Defines commands that execute one or more configured actions.
#   description - Help text shown for the shorthand command.
#   trigger     - Command syntax. It must begin with the shorthand name; arguments use the form {argument}.
#   actions     - Commands executed in order. Do not include a leading slash "/"
#
# The default permission is cxyz.shorthand.{name}.
shorthand-commands:
  sc:
    description: Enter the staff channel
    trigger: sc
    actions:
      - channel staff

  permban:
    description: Permanently ban a player from the server
    trigger: permban {player} {reason}
    actions:
      - ban {player} permanent {reason}

  hi:
    description: Say hi!
    trigger: hi
    actions:
      - show {sender-username} Hello!

  buy:
    description: Buy a cosmetic from the shop
    trigger: buy {cosmetic}
    actions:
      - cosmetic buy {cosmetic}

  equip:
    description: Equip a cosmetic you own
    trigger: equip {owned-cosmetic}
    actions:
      - cosmetic equip {owned-cosmetic}

  unequip:
    description: Unequip a cosmetic you have equipped
    trigger: unequip {equipped-cosmetic}
    actions:
      - cosmetic unequip {equipped-cosmetic}

  lock:
    description: Lock a channel to stop all players from sending messages in it
    trigger: lock {channel}
    actions:
      - channel lock {channel}

  unlock:
    description: Unlock a channel
    trigger: unlock {locked-channel}
    actions:
      - channel unlock {locked-channel}

  unvanish:
    description: Unvanish yourself
    trigger: unvanish {player}
    actions:
      - vanish disable {player}

  uv:
    description: Unvanish yourself
    trigger: uv {player}
    actions:
      - vanish disable {player}

  v:
    description: Vanish yourself
    trigger: v {player}
    actions:
      - vanish enable {player}

# ============================================================
# COMMAND ACCESS RESTRICTIONS
# ============================================================

# Adds rank/level restrictions to commands.
# Players must still have the normal command permission.
#
# Each entry is keyed by the command path. Dotted commands may be represented as nested YAML sections by Bukkit.
#   minimum-rank  - Lowest rank hierarchy allowed to use the command.
#   minimum-level - Lowest player level allowed to use the command.
#   message       - Message shown when either requirement is not met.
#
# Both minimum-rank and minimum-level requirements must be satisfied.

command-restrictions:

  chatcolor:
    minimum-rank: vip
    minimum-level: 0
    message: "&eYou may not use this unless you are a &f[[&aVIP&f]]&e!"

# ============================================================
# COMMAND COOLDOWNS
# ============================================================
# Adds a "cooldown" period where a player cannot execute commands.
# All durations are in seconds.

cooldowns:
  # Required fields:
  #   name               - The registered name of the command. [For per-command-rules only!]
  #   cooldown           - The amount of SECONDS a player is allowed to consecutively execute the same command.
  #   affected-ranks     - The affected ranks by the cooldown rule. If a players' rank is included in this list, they will be subject to the cooldown unless they also have an exempted rank.
  #   exempt-ranks       - The ranks' not subject to the cooldown under any circumstances.
  #   scope [cmd, all]   - The scope of the cooldown rule.
  #                         cmd: The cooldown rule only affects the execution of the same command.
  #                         all: The cooldown rule affects all commands.

  global-rules:
    - cooldown: 2
      affected-ranks: [default]
      exempt-ranks: [admin]
      scope: all

  per-command-rules:
    - name: "message"
      cooldown: 3
      affected-ranks: [default]
      exempt-ranks: [mvp]
      scope: all

    - name: "cosmetic.buy"
      cooldown: 3
      affected-ranks: [ default ]
      exempt-ranks: [ mvp ]
      scope: all
