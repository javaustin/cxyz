# ============================================================
# ENVIRONMENT VARIABLES
# ============================================================
# You can use environment variables to provide configuration values at runtime,
# which is useful when deploying multiple servers without editing this file.
#
# To use an environment variable, set a supported value to "ENV:{VARIABLE_NAME}".
# Replace {VARIABLE_NAME} with the name of the environment variable. For example:
#   identifier: "ENV:IDENTIFIER"
#
# [!] The plugin will crash if an environment variable does not exist, or it cannot access the variable,
#
# [!] Environment-variable references are supported only in the server definitions, and http settings (the first two sections).
#     No other config values support this feature

# ============================================================
# SERVER AND API DEFINITIONS
# ============================================================
# For communicating securely with the backend API server, we must send requests with an identity and a signature.
# These can also be defined by environment variables if present.
#
# Required fields:
#   identifier          - An identifiable name for this server (e.g. "HUB-1"). Spaces not recommended.
#   secret              - A secret key used to authenticate HTTP requests server to server.
#   endpoint [api only] - The publicly reachable URL of your backend API server (e.g. https://api.cerrot.xyz)
this-server:
  identifier: "ENV:IDENTIFIER"
  secret: "ENV:SECRET"

api:
  identifier: "ENV:API_IDENTIFIER"
  endpoint: "ENV:API_ENDPOINT"
  secret: "ENV:API_SECRET"


# ============================================================
# HTTP SETTINGS
# ============================================================
# Defines behavior for this plugin's HTTP client and outbound requests.
# These can also be defined by environment variables if present.
#
#   Request timeout - Maximum time (in milliseconds) to wait for a response before cancelling the HTTP(s) request.
#   HTTP Port       - Any open HTTP port for the API to send data to. (If using a Minecraft server host, you may need to use a 'Create Allocation' feature.)
request-timeout-millis: 5000
http-port: 59152


# ============================================================
# SERVER TIME SETTINGS
# ============================================================
# Default timezone used by the plugin. Players can set individual timezones that override this.
# Format must follow IANA timezone naming:
# Example: America/Los_Angeles
timezone: America/Los_Angeles

# Format used when displaying dates and times.
# Formatting reference:
# https://docs.oracle.com/javase/8/docs/api/java/time/format/DateTimeFormatter.html

date-format: MMMM d, yyyy
date-short-format: M/d/yyyy
time-format: h:mm a (z)
time-short-format: h:mm a


# ============================================================
# DEBUGGING
# ============================================================
# Enables additional logging for troubleshooting.
#
# Available options:
#  COSMETIC,
#  FRIEND_REQUEST,
#  GAME_STAT,
#  MAP,
#  MESSAGE_PARSER,
#  PARTY,
#  PLAYER_MESSAGE,
#  PUNISHMENT,
#  REQUESTS,
#  SHORTHAND_COMMANDS,
#  USER
#
# Leave empty [] to disable debugging.
# These debuggers can always be enabled or disabled using the /debug command.
debugger:
  enabled-values: []


# ============================================================
# NETWORK RANKS
# ============================================================
# Ranks stored in the central user database and shared across the network.
#
# Permissions automatically follow the format:
#   cxyz.rank.{rankName}
#
# Example:
#   cxyz.rank.vip
#
# NOTE:
# - A default rank is required and denoted by "default". If one is not provided in config this plugin will make one for you.
# - Hierarchy is required and must be unique to the rank. Higher hierarchy values override lower ones.
# - Ranks are individual and do not stack.
ranks:

  default:
    prefix: '&7'
    color: '&7'
    defaultChatColor: '&f'
    chat-cooldown: 3
    hierarchy: 0
  
  vip:
    prefix: '&f[&aVIP&f] '
    color: '&a'
    default-chat-color: '&f'
    chat-cooldown: 1
    hierarchy: 1
  
  mvp:
    prefix: '&f[&bMVP&f] '
    color: '&b'
    default-chat-color: '&f'
    chat-cooldown: 0
    hierarchy: 2
  
  mod:
    prefix: '&f[&eMod&f] '
    color: '&e'
    default-chat-color: '&f'
    chat-cooldown: 0
    hierarchy: 3
  
  admin:
    prefix: '&f[&cAdmin&f] '
    color: '&c'
    default-chat-color: '&f'
    chat-cooldown: 0
    hierarchy: 4


# ============================================================
# CHAT SYSTEM
# ============================================================
# Channels allow communication across all servers.
#
# Permissions required to use a channel:
#   cxyz.channel.{channel}
#
# NOTE:
# - Channel names must be unique
# - Channel names are NOT case-sensitive
# - Do NOT reuse trigger-prefix values
chat:

  # ----------------------------------------------------------
  # CORE CHANNELS
  # ----------------------------------------------------------
  # These are built-in system channels.
  # Do NOT add new ones here.

  # These channels are accessible by default. You can restrict players from using these channels by denying the permission "cxyz.channel.{name}".

  core-channels:

    all:
      prefix: '&ePUBLIC'
      read-only: false
      console: true
      ignorable: false
      webhook-url: ''
      chat-format: '[{player-tag}](HOVER:{player-tag-lore})[{player-rank-prefix}](HOVER:{player-custom-rankplate-lore}){player-rank-color}{player-display-name}: {player-chat-color}{message}'
      trigger-prefix: ""
      aliases: [public, pub, a]
      lockable: true
      locked: false

    party:
      prefix: '&9PARTY'
      read-only: false
      console: false
      ignorable: true
      webhook-url: ''
      chat-format: ''
      trigger-prefix: ""
      aliases: [p]
      lockable: true
      locked: false

    message:
      prefix: '&dMESSAGE'
      read-only: false
      console: false
      ignorable: true
      webhook-url: ''
      chat-format: ''
      trigger-prefix: ""
      aliases: [msg, m]
      lockable: true
      locked: false


  # ----------------------------------------------------------
  # CUSTOM CHANNELS
  # ----------------------------------------------------------
  # You may create additional private or staff channels here.

  # These channels are private by default. You can allow players to use these channels adding the permission "cxyz.channel.{name}".

  custom-channels:
    logs:
      chat-format: '{channel-prefix}&7{content}'
      console: true
      ignorable: true
      prefix: '&e[Logger] '
      read-only: true
      trigger-prefix: ''
      webhook-url: ''
      aliases: [ ]
      lockable: true
      locked: false

    staff:
      prefix: '&c[Staff] '
      read-only: false
      console: true
      ignorable: true
      webhook-url: ''
      chat-format: '{channel-prefix}{player-rank-color}{player-display-name}: &f{content}'
      trigger-prefix: '#'
      aliases: [ s ]
      lockable: true
      locked: false

    manager:
      prefix: '&4[Manager] '
      read-only: false
      console: true
      ignorable: true
      webhook-url: ''
      chat-format: '{channel-prefix}{player-rank-color}{player-display-name}: &f{content}'
      trigger-prefix: '$'
      aliases: [ ]
      lockable: true
      locked: false

    announcement:
      prefix: '&6Announcement'
      read-only: true
      console: true
      ignorable: true
      webhook-url: ''
      chat-format: '{message}'
      trigger-prefix: ""
      aliases: [ ]
      lockable: true
      locked: false

  # ----------------------------------------------------------
  # DEFAULT CHANNEL MAPPINGS
  # ----------------------------------------------------------
  # Format: function -> channel
  #
  # Available functions:
  #
  # PUBLIC,
  # PARTY,
  # MESSAGE,
  # ANNOUNCEMENT,
  # PUNISHMENT
  #
  defaults:
    announcement: announcement
    punishment: staff
    message: message
    party: party
    public: all

  # ----------------------------------------------------------
  # CHAT FILTER
  # ----------------------------------------------------------
  # Players with permission cxyz.chat-filter-bypass.{rule} will bypass the filter rule.

  chat-filter:
    enabled: true

    rules:
      example-rule:
        enabled-channels: [all, message]
        blacklisted-words: ["nigger", "faggot"]
        actions:
          - mute {player} 24h discriminatory language


# ============================================================
# COLOR DEFINITIONS
# ============================================================
# Defines color names usable in plugin commands and configs.

colors:

  # Minecraft legacy colors
  black: "&0"
  dark_blue: "&1"
  dark_green: "&2"
  dark_aqua: "&3"
  dark_red: "&4"
  dark_purple: "&5"
  gold: "&6"
  gray: "&7"
  dark_gray: "&8"
  blue: "&9"
  green: "&a"
  aqua: "&b"
  red: "&c"
  light_purple: "&d"
  yellow: "&e"
  white: "&f"

  # Example custom color
  darker_green: "&x&2&f&a&5&2&b"


# ============================================================
# ANNOUNCEMENTS
# ============================================================
# Broadcast messages that appear across servers.
#
# enabled    - If set to false, the announcement will never send
# content    - The parsable content of the announcement
# channel    - The chat channel the announcement will be sent in
# delay      - The delay (in seconds) the plugin should wait until sending the announcement (from plugin startup)
# interval   - The delay (in seconds) the plugin should wait to repeat the announcement (set to 0 to never repeat)
# scope      - (GLOBAL, LOCAL). If GLOBAL, the announcement will be sent to all game servers. If not, the announcement will only be sent on this server.

announcements:

  new-example-announcement:
    enabled: true
    content: '&4Another example announcement'
    channel: announcement
    delay: 30
    interval: 60
    scope: GLOBAL


# ============================================================
# PARTY SYSTEM
# ============================================================
parties:
  enabled: true
  autokick-after: 300
  invites-expire-after: 60
  max-players: 10000


# ============================================================
# FRIEND SYSTEM
# ============================================================
friends:
  requests-expire-after: 300 # The amount of seconds to wait before a friend request to another player expires.


# ============================================================
# PUNISHMENT DEFAULTS
# ============================================================
punishments:
  defaults:

    reasons:
      warn: Bad Behavior
      mute: Chat Abuse
      kick: Unspecified
      ban: Hacking

    durations: # Enter times in SECONDS
      permanent: "permanent" # If the duration is permanent, this text will show instead of a non-useful number like 0 or -1.

      effective-until: # The time until the punishment is no longer effective.
        warn: 604800 # 1 week (warns are stored but do not affect the player - to control records - modify the expiry value)
        mute: 3600 # 1 hour
        kick: 0 # (Kicks are not persistent by definition, any value here will be ignored)
        ban: -1 # Permanent

      expire: # The time until the record of the punishment is cleared.
        warn: -1 # Record never expires
        mute: 2622600 # Record expires after a month of the issuing
        kick: 0 # Record expires immediately
        ban: -1 # Record never expires

  # Commands that a player is restricted from executing when they are muted.
  # This list requires an exact "starts with" string match, so be sure to include command aliases if you wish to restrict those.
  mute-restrictions:
  - msg
  - message
  - r
  - party chat
  - broadcast


# ============================================================
# SOCIAL DISPLAY SETTINGS
# ============================================================
# When a player joins the server, you can configure their Minecraft display names and tab list name, in addition to their join and leave messages.
social:
  player-default-list-name: "{player-rank-prefix}{player-rank-color}{player-display-name}"
  player-default-display-name: "{player-rank-color}{player-display-name}"

  player-join-message: ""
  player-leave-message: ""

# ============================================================
# CUSTOM COMMAND SHORTHANDS
# ============================================================
shorthand-commands:
  sc:
    description: Enter the staff channel
    trigger: sc
    actions:
      - channel staff

  permban:
    description: Permanently ban a player from the server
    trigger: permban {player} {reason}
    actions:
      - ban {player} permanent {reason}

  hi:
    description: Say hi!
    trigger: hi
    actions:
      - show {sender-username} Hello!

  buy:
    description: Buy a cosmetic from the shop
    trigger: buy {cosmetic}
    actions:
      - cosmetic buy {cosmetic}

  equip:
    description: Equip a cosmetic you own
    trigger: equip {owned-cosmetic}
    actions:
      - cosmetic equip {owned-cosmetic}

  unequip:
    description: Unequip a cosmetic you have equipped
    trigger: unequip {equipped-cosmetic}
    actions:
      - cosmetic unequip {equipped-cosmetic}

  lock:
    description: Lock a channel to stop all players from sending messages in it
    trigger: lock {channel}
    actions:
      - channel lock {channel}

  unlock:
    description: Unlock a channel
    trigger: unlock {locked-channel}
    actions:
      - channel unlock {locked-channel}

  unvanish:
    description: Unvanish yourself
    trigger: unvanish {player}
    actions:
      - vanish disable {player}

  uv:
    description: Unvanish yourself
    trigger: uv {player}
    actions:
      - vanish disable {player}

  v:
    description: Vanish yourself
    trigger: v {player}
    actions:
      - vanish enable {player}

# ============================================================
# COMMAND ACCESS RESTRICTIONS
# ============================================================

# Adds rank/level restrictions to commands.
# Command paths omit the cxyz access prefix, for example chatcolor or cosmetic.buy.
# Players must still have the normal command permission.

command-restrictions:

  chatcolor:
    minimum-rank: vip
    minimum-level: 0
    message: "&eYou may not use this unless you are a &f[[&aVIP&f]]&e!"

# ============================================================
# COMMAND COOLDOWNS
# ============================================================
# Adds a "cooldown" period where a player cannot execute commands.


cooldowns:
# Required fields:
#   name               - The registered name of the command. [For per-command-rules only!]
#   cooldown           - The amount of SECONDS a player is allowed to consecutively execute the same command.
#   affected-ranks     - The affected ranks by the cooldown rule. If a players' rank is included in this list, they will be subject to the cooldown unless they also have an exempted rank.
#   exempt-ranks       - The ranks' not subject to the cooldown under any circumstances.
#   scope [cmd, all]   - The scope of the cooldown rule.
#                         cmd: The cooldown rule only affects the execution of the same command.
#                         all: The cooldown rule affects all commands.

  global-rules:
    - cooldown: 2
      affected-ranks: [default]
      exempt-ranks: [vip]
      scope: all

  per-command-rules:
    - name: "message"
      cooldown: 3
      affected-ranks: [default]
      exempt-ranks: [mvp]
      scope: all

    - name: "cosmetic.buy"
      cooldown: 3
      affected-ranks: [ default ]
      exempt-ranks: [ mvp ]
      scope: all
